name: edinet
title: EDINET 開示データ
description: |-
  金融庁 EDINET の開示書類の一覧、提出者とファンドのマスタ、有価証券報告書・半期報告書の財務データと主要経営指標、有報の従業員・女性活躍の指標、表紙の本店所在地・電話番号、関係会社の状況です。提出者の法人番号で houjin_bangou・gbizinfo と結合できます。

  出典：金融庁 EDINET（書類一覧 API・書類取得 API・EDINETコードリスト・ファンドコードリスト）。Queria が加工したもので、提供情報の最新性、正確性、完全性等が保証されたものではありません。
