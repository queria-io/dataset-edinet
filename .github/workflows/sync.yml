name: Apply

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *" # 毎日 04:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@252f25b5f027b83c61e265125e7557259135e8e7
    with:
      dataset_name: edinet
      # 共通の既定 90 分では足りない。成功ランの実測は最大 147 分
      timeout_minutes: 240
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
