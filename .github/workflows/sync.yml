name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    - cron: "0 19 * * *" # 毎日 04:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@fe59be721647d5b1bbffe1ef3eb2d318c81be3f3
    with:
      dataset_name: edinet
      # 共通の既定 90 分では足りない。成功ランの実測は最大 147 分
      timeout_minutes: 240
    secrets:
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
