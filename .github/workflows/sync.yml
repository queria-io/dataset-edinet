name: Apply

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *" # 毎日 04:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@5438b43d5e32827d10d49863aa57f4f5303fbab7
    with:
      dataset_name: edinet
      # 共通の既定 90 分では足りない。run 44873306215 は取得とビルドに 2 時間、
      # fdl push のプロファイルに 2 時間を超えて 240 分で打ち切られた。GitHub のランナーの上限の 360 分にする
      timeout_minutes: 360
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
