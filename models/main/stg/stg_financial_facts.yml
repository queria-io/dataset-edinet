version: 2

models:
  - name: stg_financial_facts
    description: >-
      EDINET 書類取得 API (type=5 CSV) の財務データ本体を生に忠実な縦持ちで保持する
      ファクトテーブル。要素ID (標準タクソノミ, 例 jppfs_cor:NetSales) を横断比較キーとして
      使える。1 行 = 1 要素 × コンテキスト。現状は有価証券報告書 (提出時点の本体) のみ。
      訂正報告書による訂正は未反映。全期間は段階的に充填中。
    columns:
      - name: doc_id
      - name: edinet_code
      - name: sec_code
      - name: corporate_number
      - name: filer_name
      - name: doc_type_code
      - name: period_end
      - name: submit_date
      - name: doc_description
      - name: element_id
      - name: item_name
      - name: context_id
      - name: relative_year
      - name: consolidated_individual
      - name: period_instant
      - name: unit_id
      - name: unit
      - name: value
      - name: numeric_value
      - name: csv_type
      - name: row_seq
