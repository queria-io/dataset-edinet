schema: main
name: stg_financial_facts
title: EDINET 財務ファクト（有報・半期報告書・生データ）
description: |-
  有価証券報告書と半期報告書の財務データを、XBRL の要素 ID × コンテキストの縦持ちで持つものです。1 行が 1 要素・1 コンテキストです。

  - `doc_type_code` で書類の種類を分けます（120=有価証券報告書、160=半期報告書）
  - 提出時点の本体だけで、訂正報告書による訂正は反映していません
published: true
sources:
  - path: https://disclosure2.edinet-fsa.go.jp/
fields:
  - name: doc_id
    title: 書類管理番号
    description: mart_documents / stg_documents と結合できる
  - name: edinet_code
    title: 提出者EDINETコード
  - name: sec_code
    title: 提出者証券コード
  - name: corporate_number
    title: 提出者法人番号
    description: 13桁。houjin_bangou / gbizinfo と結合できる
    semantic: { role: entity, name: corporate_number }
  - name: filer_name
    title: 提出者名
  - name: doc_type_code
    title: 書類種別コード
    description: 120=有価証券報告書 / 160=半期報告書
  - name: period_end
    title: 会計期間（至）
    description: 対象事業年度の末日。半期報告書も事業年度末
  - name: submit_date
    title: 提出日
  - name: doc_description
    title: 提出書類概要
  - name: element_id
    title: 要素ID
    description: XBRL 標準タクソノミの要素ID（例 jppfs_cor:NetSales）。横断比較の鍵
  - name: item_name
    title: 項目名
    description: 要素の日本語ラベル
  - name: context_id
    title: コンテキストID
    description: 期間・連結区分・セグメントの識別子（CurrentYearInstant など）
  - name: relative_year
    title: 相対年度
    description: 当期 / 前期 / … / 当期末 / 前期末 / 提出日時点 など
  - name: consolidated_individual
    title: 連結・個別
    description: 連結 / 個別 / その他。連結区分は context_id で判別する
  - name: period_instant
    title: 期間・時点
  - name: unit_id
    title: ユニットID
  - name: unit
    title: 単位
    description: 円 / 株 / ％ 等
  - name: value
    title: 値
    description: CSV の生の値（数値・テキストブロックを含む）
  - name: numeric_value
    title: 数値
    description: value を数値化したもの（数値でない場合は NULL）
  - name: csv_type
    title: CSV様式コード
    description: jpcrp030000-asr=有報本体 / jpaud=監査報告書 / jpsps=投信 等
  - name: row_seq
    title: CSV内行番号
