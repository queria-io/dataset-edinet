version: 2

models:
  - name: mart_affiliated_entities
    description: >-
      有価証券報告書の「関係会社の状況」を 1 社 1 行にした表。親会社・連結子会社・持分法適用関連会社・その他の関係会社の名称・住所・資本金・主要な事業の内容・議決権の所有割合・関係内容を持つ。XBRL 本体（書類取得 API type=1）のテキストブロックの表を列見出しで読んで作る。大企業は主要な関係会社だけを載せていることがあり、全子会社の一覧ではない。
    columns:
      - name: doc_id
        data_tests: [not_null]
      - name: edinet_code
      - name: sec_code
      - name: corporate_number
      - name: filer_name
      - name: period_end
      - name: fiscal_year
      - name: submit_date
      - name: row_seq
      - name: category
      - name: category_group
      - name: name
        data_tests: [not_null]
      - name: note_refs
      - name: address
      - name: capital_text
      - name: capital_amount
      - name: capital_unit
      - name: capital_yen
      - name: business
      - name: voting_rights_text
      - name: voting_rights_ratio
      - name: voting_rights_indirect_ratio
      - name: voting_rights_held_by_affiliate
      - name: relationship
