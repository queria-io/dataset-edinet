schema: main
name: mart_companies
title: EDINET 企業マスタ
description: EDINET 企業マスタ（EDINETコードリスト。提出者の業種・市場区分・資本金・決算日・法人番号等。1行1提出者）
published: true
sources:
  - path: https://disclosure2.edinet-fsa.go.jp/
fields:
  - name: edinet_code
    title: EDINETコード
    description: E+5桁。mart_documents と edinet_code で結合できる
  - name: submitter_type
    title: 提出者種別
    description: 内国法人・組合、外国法人 等
  - name: listing_status
    title: 上場区分
    description: 上場 / 非上場
  - name: is_consolidated
    title: 連結の有無
  - name: capital
    title: 資本金
    description: 出典CSVの単位のまま
  - name: fiscal_year_end
    title: 決算日
    description: 5月31日 等の月日
  - name: filer_name
    title: 提出者名
  - name: filer_name_en
    title: 提出者名（英字）
  - name: filer_name_kana
    title: 提出者名（ヨミ）
  - name: address
    title: 所在地
  - name: industry
    title: 提出者業種
  - name: sec_code
    title: 証券コード
    description: 末尾0付き5桁。非上場は空
  - name: corporate_number
    title: 提出者法人番号
    description: 13桁。houjin_bangou / gbizinfo と結合できる
