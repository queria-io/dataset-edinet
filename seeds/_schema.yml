version: 2

seeds:
  - name: doc_types
    description: |
      EDINET 書類種別コード（docTypeCode）と名称の対応表。
      出典: EDINET API 仕様書 Version 2「4-1 参考資料 書類種別コード」
    columns:
      - name: doc_type_code
        description: 書類種別コード（3桁）
      - name: doc_type_name
        description: 書類種別名称
  - name: context_relative_years
    description: |
      XBRL のコンテキスト ID の頭（EDINET の命名規約）と、type=5 の CSV の「相対年度」の対応表。
      type=1 の書類と CSV を突き合わせて、すべての行で CSV と同じ値になることを確かめたもの。
      CSV で相対年度が空の頭（RecordDateInstant など）は、空の値で入れる。
      新しい頭が出てきたら stg_financial_facts_relative_year_known のテストが落ちるので、ここに 1 行足す。
    columns:
      - name: context_prefix
        description: コンテキスト ID の最初の _ より前（CurrentYearDuration など）
      - name: relative_year
        description: 相対年度（当期・前期末・提出日時点など）
